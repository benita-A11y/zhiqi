<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#C5B4E3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="执棋" />
  <meta name="description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <meta property="og:title" content="执棋 · 每日落一子" />
  <meta property="og:description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <title>执棋 · 每日落一子</title>
  <link rel="manifest" href="assets/manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 应用根 -->
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♟</span>
        <div class="brand-text">
          <h1>执棋</h1>
          <p id="topbar-date">—</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="streak-chip" id="streak-chip" title="连续落子">
          <span class="fire">🔥</span><span id="streak-num">0</span>
        </button>
        <button class="icon-btn" id="open-strategist" title="召唤军师">
          <span class="hat">🎖️</span>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="view" class="view"></main>

    <!-- 底部导航（移动端） -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="today"><span>♟️</span><em>今日棋局</em></button>
      <button class="tab" data-view="calendar"><span>📅</span><em>棋历</em></button>
      <button class="tab" data-view="manual"><span>📋</span><em>棋谱</em></button>
      <button class="tab" data-view="notes"><span>📝</span><em>随记</em></button>
      <button class="tab" data-view="power"><span>📊</span><em>棋力</em></button>
      <button class="tab" data-view="undercover"><span>🔐</span><em>卧底</em></button>
    </nav>
  </div>

  <!-- 军师浮层 -->
  <div class="sheet-mask" id="strategist-sheet" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>🎖️ 军师 · 摆渡人</h2>
        <button class="icon-btn" id="close-strategist">✕</button>
      </div>
      <div class="strategist-log" id="strategist-log"></div>
      <div class="strategist-actions">
        <button class="btn ghost" id="btn-tomorrow-preview">预览明日棋局</button>
        <button class="btn ghost" id="btn-new-goal-suggest">推荐新棋</button>
        <button class="btn primary" id="btn-strategist-dispatch">军师今日派发</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="sheet-mask" id="modal-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2 id="modal-title">—</h2>
        <button class="icon-btn" id="close-modal">✕</button>
      </div>
      <div class="sheet-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 脚本（普通 script，保证 file:// 直接打开也能跑） -->
  <script src="assets/js/store.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/undercover.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
