<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#C5B4E3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="执棋" />
  <meta name="description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <meta property="og:title" content="执棋 · 每日落一子" />
  <meta property="og:description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <title>执棋 · 每日落一子</title>
  <link rel="manifest" href="assets/manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css?v=29" />
</head>
<body>
  <!-- 应用根 -->
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♟</span>
        <div class="brand-text">
          <h1>执棋</h1>
          <p id="topbar-date">—</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="streak-chip" id="streak-chip" title="连续落子">
          <span class="fire">🔥</span><span id="streak-num">0</span>
        </button>
        <button class="icon-btn" id="open-strategist" title="召唤军师">
          <img class="hat" src="assets/img/strategist-avatar.png" alt="军师">
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="view" class="view"></main>

    <!-- 底部导航（移动端）：按使用频率与流程排布 —— 核心循环(计划→执行→目标→复盘)常驻 + 更多入口 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="today"><span class="t-in"><span class="t-ic">♟️</span><em>今日</em></span></button>
      <button class="tab" data-view="calendar"><span class="t-in"><span class="t-ic">📅</span><em>棋历</em></span></button>
      <button class="tab" data-view="manual"><span class="t-in"><span class="t-ic">📋</span><em>谋局</em></span></button>
      <button class="tab" data-view="notes"><span class="t-in"><span class="t-ic">📝</span><em>随记</em></span></button>
      <button class="tab" data-view="more"><span class="t-in"><span class="t-ic">⋯</span><em>更多</em></span></button>
    </nav>
  </div>

  <!-- 军师浮层（大脑入口，常驻；去除与棋谱重复的「推荐新棋」） -->
  <div class="sheet-mask" id="strategist-sheet" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2><img class="sheet-avatar" src="assets/img/strategist-avatar.png" alt=""> 军师 · 摆渡人</h2>
        <button class="icon-btn" id="close-strategist">✕</button>
      </div>
      <div class="strategist-log" id="strategist-log"></div>
      <div class="strategist-actions">
        <button class="btn ghost" id="btn-tomorrow-preview">预览明日棋局</button>
        <button class="btn primary" id="btn-strategist-dispatch">军师今日派发</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="sheet-mask" id="modal-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2 id="modal-title">—</h2>
        <button class="icon-btn" id="close-modal">✕</button>
      </div>
      <div class="sheet-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 更多 · 收纳抽屉（二级常用 + 三级工具箱） -->
  <div class="sheet-mask" id="more-sheet" hidden>
    <div class="sheet more-sheet">
      <div class="sheet-head">
        <h2>☰ 更多功能</h2>
        <button class="icon-btn" id="close-more">✕</button>
      </div>
      <div class="more-body" id="more-body"><!-- 由 app.js 按 NAV 配置统一生成，避免定义漂移 --></div>
    </div>
  </div>

  <!-- 数据备份 弹窗（三级 · 低频，原混在棋力里） -->
  <div class="sheet-mask" id="backup-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2>💾 数据备份</h2>
        <button class="icon-btn" id="close-backup">✕</button>
      </div>
      <div class="sheet-body">
        <p class="small muted">所有数据存在本机，飞行模式也能用。建议常导出备份，换设备时再导入恢复。</p>
        <div class="row wrap mt16">
          <button class="btn ghost" id="export-btn">⬇ 导出备份</button>
          <button class="btn ghost" id="import-btn">⬆ 导入恢复</button>
          <button class="btn ghost danger" id="reset-btn">↺ 重置棋局</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </div>
  </div>

  <!-- 关于 弹窗 -->
  <div class="sheet-mask" id="about-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2>ℹ️ 关于执棋</h2>
        <button class="icon-btn" id="close-about">✕</button>
      </div>
      <div class="sheet-body">
        <p class="small muted" style="line-height:1.7">执棋 · 每天落一子，十年成大局。<br>你不是在打卡，是在卧底。<br><br>以目标拆解为核心，把宏大计划变成每天可完成的小任务。数据全部离线保存在本机。</p>
        <div class="about-ver" id="about-ver">版本加载中…</div>
      </div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 脚本（普通 script，保证 file:// 直接打开也能跑；?v=N 让更新必走网络） -->
  <script src="assets/js/store.js?v=29"></script>
  <script src="assets/js/brain.js?v=29"></script>
  <script src="assets/js/oracle.js?v=29"></script>
  <script src="assets/js/engine.js?v=29"></script>
  <script src="assets/js/undercover.js?v=29"></script>
  <script src="assets/js/ui.js?v=29"></script>
  <script src="assets/js/app.js?v=29"></script>
</body>
</html>
