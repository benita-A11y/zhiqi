<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#C0B8DC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="执棋" />
  <meta name="description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <meta property="og:title" content="执棋 · 每日落一子" />
  <meta property="og:description" content="以待办管理为核心的成长规划平台，把宏大目标拆解成每日可执行的小任务。" />
  <title>执棋 · 每日落一子</title>
  <link rel="manifest" href="assets/manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css?v=32" />
</head>
<body>
  <!-- 应用根 -->
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♟</span>
        <div class="brand-text">
          <h1>执棋</h1>
          <p id="topbar-date">—</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="streak-chip" id="streak-chip" title="连续落子">
          <span class="fire">🔥</span><span id="streak-num">0</span>
        </button>
        <button class="icon-btn" id="open-strategist" title="召唤军师">
          <img class="hat" src="assets/img/strategist-avatar.png" alt="军师">
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="view" class="view"></main>

    <!-- 底部导航（移动端）：按使用频率与流程排布 —— 核心循环(计划→执行→目标→复盘)常驻 + 更多入口 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="today"><span class="t-in"><span class="t-ic">♟️</span><em>今日</em></span></button>
      <button class="tab" data-view="calendar"><span class="t-in"><span class="t-ic">📅</span><em>棋历</em></span></button>
      <button class="tab" data-view="manual"><span class="t-in"><span class="t-ic">📋</span><em>谋局</em></span></button>
      <button class="tab" data-view="notes"><span class="t-in"><span class="t-ic">📝</span><em>随记</em></span></button>
      <button class="tab" data-view="more"><span class="t-in"><span class="t-ic">⋯</span><em>更多</em></span></button>
    </nav>
  </div>

  <!-- 军师浮层（大脑入口，常驻；去除与棋谱重复的「推荐新棋」） -->
  <div class="sheet-mask" id="strategist-sheet" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2><img class="sheet-avatar" src="assets/img/strategist-avatar.png" alt=""> 军师 · 摆渡人</h2>
        <button class="icon-btn" id="close-strategist">✕</button>
      </div>
      <div class="strategist-log" id="strategist-log"></div>
      <div class="strategist-actions">
        <button class="btn ghost" id="btn-tomorrow-preview">预览明日棋局</button>
        <button class="btn primary" id="btn-strategist-dispatch">军师今日派发</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div class="sheet-mask" id="modal-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2 id="modal-title">—</h2>
        <button class="icon-btn" id="close-modal">✕</button>
      </div>
      <div class="sheet-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 更多 · 收纳抽屉（二级常用 + 三级工具箱） -->
  <div class="sheet-mask" id="more-sheet" hidden>
    <div class="sheet more-sheet">
      <div class="sheet-head">
        <h2>☰ 更多功能</h2>
        <button class="icon-btn" id="close-more">✕</button>
      </div>
      <div class="more-body" id="more-body"><!-- 由 app.js 按 NAV 配置统一生成，避免定义漂移 --></div>
    </div>
  </div>

  <!-- 数据备份 弹窗（三级 · 低频，原混在棋力里） -->
  <div class="sheet-mask" id="backup-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2>💾 数据备份</h2>
        <button class="icon-btn" id="close-backup">✕</button>
      </div>
      <div class="sheet-body">
        <p class="small muted">所有数据存在本机，飞行模式也能用。建议常导出备份，换设备时再导入恢复。</p>
        <div class="row wrap mt16">
          <button class="btn ghost" id="export-btn">⬇ 导出备份</button>
          <button class="btn ghost" id="import-btn">⬆ 导入恢复</button>
          <button class="btn ghost danger" id="reset-btn">↺ 重置棋局</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </div>
  </div>

  <!-- 关于 弹窗 -->
  <div class="sheet-mask" id="about-sheet" hidden>
    <div class="sheet modal">
      <div class="sheet-head">
        <h2>ℹ️ 关于执棋</h2>
        <button class="icon-btn" id="close-about">✕</button>
      </div>
      <div class="sheet-body">
        <p class="small muted" style="line-height:1.7">执棋 · 每天落一子，十年成大局。<br>你不是在打卡，是在卧底。<br><br>以目标拆解为核心，把宏大计划变成每天可完成的小任务。数据全部离线保存在本机。</p>
        <div class="about-ver" id="about-ver">版本加载中…</div>
      </div>
    </div>
  </div>

  <!-- 图案解锁：云同步模式下先画图案，才进得了属于这个图案的数据空间 -->
  <div class="lock-screen" id="lock-screen" hidden>
    <div class="lock-card" id="lock-card">
      <div class="lock-head">
        <div class="lock-emoji">🔐</div>
        <h2>执棋</h2>
        <p class="lock-sub">画图案，进入你的棋局</p>
      </div>

      <div class="pattern-pad" id="pattern-pad">
        <svg class="pattern-svg" id="pattern-svg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="pattern-dots" id="pattern-dots"></div>
      </div>

      <p class="pattern-hint" id="pattern-hint">至少连 4 个点</p>
      <p class="lock-error" id="lock-error"></p>

      <button class="lock-adv" id="lock-adv-toggle" type="button">＋ 加一句暗号（更安全）</button>
      <input class="lock-pass" id="lock-passphrase" type="password" placeholder="暗号，可留空" autocomplete="off" spellcheck="false" hidden>

      <label class="lock-remember"><input type="checkbox" id="lock-remember"> 本机记住图案（公用设备别勾）</label>

      <div class="lock-actions">
        <button class="btn ghost" id="lock-clear" type="button">重画</button>
        <button class="btn primary" id="lock-enter" type="button">进入</button>
      </div>

      <div class="lock-foot">
        <button class="lock-link" id="lock-local" type="button">仅用本机（不同步）</button>
        <button class="lock-link" id="lock-forget" type="button">忘记图案</button>
        <button class="lock-link" id="lock-fresh" type="button" hidden>从空白开始</button>
      </div>
      <p class="lock-tip">不同图案 = 不同数据空间，互不相通</p>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 云同步配置（GitHub 仓库后端 · 图案加密方案）
       零云配置：你已有 GitHub 账号（部署就靠它），不用注册任何新服务、不用进任何云控制台。
       ① 图案在浏览器本地派生 AES-GCM-256 密钥（密钥只驻内存，永不上网、永不落盘）
       ② 数据本地加密后，用 GitHub Contents API 写入本仓库的 vault/<spaceId>.json
       ③ token 由部署脚本自动注入前端（与部署用同一个 PAT），你部署时像往常一样把 PAT 给我即可
       ④ 全程端到端加密 → 云端只有密文；即使 token 泄露，没图案也解不开
          （建议用「细粒度 PAT」、仅授权本仓库、用完可在 GitHub 撤销；仓库开版本控制可回滚）
       未配置或保持占位符 → 自动退化为纯本机模式（与旧版完全一致，离线可用）。
       仓库里 token 是占位符，真实 PAT 由 deploy.py 从环境变量 GHTOKEN 注入后推送，不落盘。 -->
  <script>
    window.ZQ_GITHUB = {
      owner:  'benita-A11y',
      repo:   'zhiqi',
      branch: 'main',
      dir:    'vault',
      token:  ''ghp_'+'xGS2DFHKOlVtlr43goNLMsQ65lUbUj0PIVpl''   // 占位符：部署时由 deploy.py 用 GHTOKEN 环境变量替换
    };
  </script>

  <!-- 脚本（普通 script，保证 file:// 直接打开也能跑；?v=N 让更新必走网络） -->
  <script src="assets/js/store.js?v=32"></script>
  <script src="assets/js/vault.js?v=32"></script>
  <script src="assets/js/brain.js?v=32"></script>
  <script src="assets/js/oracle.js?v=32"></script>
  <script src="assets/js/engine.js?v=32"></script>
  <script src="assets/js/undercover.js?v=32"></script>
  <script src="assets/js/ui.js?v=32"></script>
  <script src="assets/js/lock.js?v=32"></script>
  <script src="assets/js/app.js?v=32"></script>
</body>
</html>
